<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Coming Soon | Penalty Shootout Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-image: url("/Football_Finals_KV_MkAH_01_\(9x16\)_AM.png");
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            background-color: #0f172a;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        .content-container {
            position: relative;
            z-index: 2;
            width: 85%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            margin-bottom: calc(40px + env(safe-area-inset-bottom));
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-size: 42px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(74, 222, 128, 0.3);
        }

        p.subtitle {
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .countdown-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 10px;
            border-radius: 16px;
            min-width: 65px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-2px);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .time-value {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }

        .time-label {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        @media (max-width: 380px) {
            .content-container { padding: 25px 15px; width: 90%; }
            h1 { font-size: 32px; }
            .time-box { min-width: 55px; padding: 10px 5px; }
            .time-value { font-size: 22px; }
            .countdown-wrapper { gap: 8px; }
        }

        /* --- TEAM SELECTION STYLES --- */
        #team-selection-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        .team-selection-content {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .team-selection-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #f87171, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .teams-wrapper {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 10px;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .team-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }

        .team-card.manchester:hover, .team-card.manchester.selected { 
            border-color: #ef4444; 
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4); 
            background: rgba(239, 68, 68, 0.1);
        }
        .team-card.arsenal:hover, .team-card.arsenal.selected { 
            border-color: #fca5a5; 
            box-shadow: 0 0 30px rgba(252, 165, 165, 0.4); 
            background: rgba(252, 165, 165, 0.1);
        }

        .team-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .team-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
        }

        .team-vote-count {
            color: #cbd5e1;
            font-size: 18px;
            margin-top: 12px;
            font-weight: 600;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden-container {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .teams-wrapper { flex-direction: column; gap: 15px; }
            .team-card { padding: 15px 10px; flex-direction: row; justify-content: flex-start; padding-left: 20px;}
            .team-logo { width: 60px; height: 60px; margin-bottom: 0; margin-right: 20px; }
            .team-name { font-size: 20px; text-align: left;}
            .team-vote-count { margin-top: 0; margin-left: auto; padding-right: 15px; }
            .team-selection-title { font-size: 24px; margin-bottom: 25px; }
        }

        /* --- LIVE SCOREBOARD (Coming Soon screen) --- */
        .scoreboard {
            margin-top: 28px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 18px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .scoreboard-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .scoreboard-title .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        .scoreboard-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .scoreboard-row:last-child { margin-bottom: 0; }

        .scoreboard-team-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .scoreboard-bar-wrap {
            flex: 1;
            background: rgba(255,255,255,0.07);
            border-radius: 999px;
            height: 10px;
            overflow: hidden;
        }

        .scoreboard-bar {
            height: 100%;
            border-radius: 999px;
            transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
            width: 0%;
        }

        .scoreboard-bar.man  { background: linear-gradient(90deg, #da291c, #000000); }
        .scoreboard-bar.ars  { background: linear-gradient(90deg, #ef0107, #db0007); }

        .scoreboard-count {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            min-width: 38px;
            text-align: right;
        }

        /* --- CSS TEAM BADGES (no copyrighted images) --- */
        .team-badge {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Shield shape via clip-path */
        .team-badge .shield {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 100% 15%, 100% 65%, 50% 100%, 0% 65%, 0% 15%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Manchester: Red top half, black bottom, gold stripe */
        .team-badge.man-badge .shield {
            background: linear-gradient(180deg, #da291c 50%, #000000 50%);
        }
        .team-badge.man-badge .shield::after {
            content: '';
            position: absolute;
            top: 48%; left: 0; right: 0;
            height: 4px;
            background: #ffe500;
        }
        .team-badge.man-badge .shield-letter {
            font-size: 32px;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            position: relative;
            z-index: 2;
            line-height: 1;
        }
        .team-badge.man-badge .shield-letter .top { color: #ffe500; display: block; }
        .team-badge.man-badge .shield-letter .bot { color: #da291c; display: block; }

        /* Arsenal: Red shield, white horizontal band, gold trim */
        .team-badge.ars-badge .shield {
            background: linear-gradient(180deg, #ef0107 40%, #9b0000 100%);
            border: 2px solid rgba(255,228,0,0.3);
        }
        .team-badge.ars-badge .shield::before {
            content: '';
            position: absolute;
            left: 15%; right: 15%;
            top: 35%; height: 28%;
            background: rgba(255,255,255,0.18);
            border-radius: 2px;
        }
        .team-badge.ars-badge .shield-letter {
            font-size: 34px;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
            line-height: 1;
        }

        /* Small badges in scoreboard */
        .team-badge-sm {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .team-badge-sm .shield {
            clip-path: polygon(50% 0%, 100% 15%, 100% 65%, 50% 100%, 0% 65%, 0% 15%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            font-family: 'Outfit', sans-serif;
        }
        .team-badge-sm.man-badge-sm .shield { background: linear-gradient(180deg, #da291c 50%, #000000 50%); color: #ffe500; }
        .team-badge-sm.ars-badge-sm .shield { background: #ef0107; color: #ffffff; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <!-- TEAM SELECTION SCREEN -->
    <div id="team-selection-container">
        <div class="team-selection-content">
            <h2 class="team-selection-title" id="selection-title">Who do you support?</h2>
            <div class="teams-wrapper">
                <div class="team-card manchester" onclick="selectTeam('Manchester')">
                    <div class="team-badge man-badge">
                        <div class="shield">
                            <span class="shield-letter"><span class="top">M</span><span class="bot">U</span></span>
                        </div>
                    </div>
                    <div>
                        <div class="team-name">ማንቸስተር ደጋፊ</div>
                        <div class="team-vote-count" id="count-manchester"></div>
                    </div>
                </div>
                <div class="team-card arsenal" onclick="selectTeam('Arsenal')">
                    <div class="team-badge ars-badge">
                        <div class="shield">
                            <span class="shield-letter">AFC</span>
                        </div>
                    </div>
                    <div>
                        <div class="team-name">አርሰናል ደጋፊ</div>
                        <div class="team-vote-count" id="count-arsenal"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay"></div>
    <div class="content-container">
        <h1>Coming Soon</h1>
        <p class="subtitle">The ultimate penalty shootout experience is almost here.</p>
        
        <div class="countdown-wrapper">
            <div class="time-box">
                <span class="time-value" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">Mins</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">Secs</span>
            </div>
        </div>

        <!-- LIVE SCOREBOARD -->
        <div class="scoreboard">
            <div class="scoreboard-title">
                <span class="live-dot"></span> Fan Support Battle
            </div>
            <div class="scoreboard-row">
                <div class="team-badge-sm man-badge-sm"><div class="shield">M</div></div>
                <div class="scoreboard-bar-wrap">
                    <div class="scoreboard-bar man" id="bar-manchester"></div>
                </div>
                <span class="scoreboard-count" id="score-manchester">—</span>
            </div>
            <div class="scoreboard-row">
                <div class="team-badge-sm ars-badge-sm"><div class="shield">A</div></div>
                <div class="scoreboard-bar-wrap">
                    <div class="scoreboard-bar ars" id="bar-arsenal"></div>
                </div>
                <span class="scoreboard-count" id="score-arsenal">—</span>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SUPABASE CONFIGURATION
        // ==========================================
        let supabaseClient = null;

        async function initSupabase() {
            // Default config fallbacks
            let config = {
                supabaseUrl: "https://YOUR_PROJECT_ID.supabase.co",
                supabaseAnonKey: "YOUR_ANON_KEY"
            };

            try {
                // Try to fetch from Vercel Serverless Function
                const res = await fetch("/api/config");
                if (res.ok) {
                    const data = await res.json();
                    if (data.supabaseUrl && data.supabaseAnonKey) {
                        config = data;
                    }
                }
            } catch (e) {
                console.log("Using local config. /api/config not found.");
            }

            if (config.supabaseUrl && config.supabaseUrl !== "https://YOUR_PROJECT_ID.supabase.co") {
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
            }
        }

        async function fetchVoteCounts() {
            if (!supabaseClient) return { manchester: 0, arsenal: 0 };
            try {
                // Get Manchester count
                const { count: manCount, error: manErr } = await supabaseClient
                    .from('team_votes')
                    .select('*', { count: 'exact', head: true })
                    .eq('team', 'Manchester');
                
                // Get Arsenal count
                const { count: arsCount, error: arsErr } = await supabaseClient
                    .from('team_votes')
                    .select('*', { count: 'exact', head: true })
                    .eq('team', 'Arsenal');
                
                return {
                    manchester: manErr ? 0 : (manCount || 0),
                    arsenal: arsErr ? 0 : (arsCount || 0)
                };
            } catch (e) {
                console.error("Error fetching counts", e);
                return { manchester: 0, arsenal: 0 };
            }
        }

        function showCounts(counts) {
            document.getElementById('count-manchester').innerText = counts.manchester + " Votes";
            document.getElementById('count-arsenal').innerText = counts.arsenal + " Votes";
        }

        function dismissSelectionScreen() {
            const container = document.getElementById('team-selection-container');
            container.classList.add('hidden-container');
        }

        async function selectTeam(teamName) {
            // Disable buttons visually
            const cards = document.querySelectorAll('.team-card');
            cards.forEach(card => {
                card.style.pointerEvents = 'none';
                if (card.classList.contains(teamName.toLowerCase())) {
                    card.classList.add('selected');
                } else {
                    card.style.opacity = '0.4';
                }
            });

            document.getElementById('selection-title').innerText = "Thanks for voting!";

            // Save vote to localStorage
            localStorage.setItem('user_voted_team', teamName);
            
            // Show loading state for counts
            document.getElementById('count-manchester').innerText = "...";
            document.getElementById('count-arsenal').innerText = "...";

            if (supabaseClient) {
                await supabaseClient.from('team_votes').insert([{ team: teamName }]);
            }

            // Fetch and show current counts
            const counts = await fetchVoteCounts();
            showCounts(counts);

            // Wait 4 seconds then transition to countdown
            setTimeout(() => {
                dismissSelectionScreen();
            }, 4000);
        }

        // --- LIVE SCOREBOARD UPDATER ---
        function updateScoreboard(counts) {
            const total = counts.manchester + counts.arsenal;
            document.getElementById('score-manchester').innerText = counts.manchester;
            document.getElementById('score-arsenal').innerText   = counts.arsenal;
            if (total > 0) {
                document.getElementById('bar-manchester').style.width = ((counts.manchester / total) * 100) + '%';
                document.getElementById('bar-arsenal').style.width    = ((counts.arsenal / total) * 100) + '%';
            } else {
                document.getElementById('bar-manchester').style.width = '50%';
                document.getElementById('bar-arsenal').style.width    = '50%';
            }
        }

        async function refreshScoreboard() {
            const counts = await fetchVoteCounts();
            updateScoreboard(counts);
        }

        // Check on load
        window.addEventListener('DOMContentLoaded', async () => {
            await initSupabase();
            const hasVoted = localStorage.getItem('user_voted_team');
            if (hasVoted) {
                // Already voted, skip directly to countdown
                dismissSelectionScreen();
            }
            // Load scoreboard right away and then every 15 seconds
            await refreshScoreboard();
            setInterval(refreshScoreboard, 15000);
        });

        // Telegram Web App Initialization
        // if (window.Telegram && window.Telegram.WebApp) {
        //     window.Telegram.WebApp.ready();
        //     window.Telegram.WebApp.expand();
        //     if (window.Telegram.WebApp.disableVerticalSwipes) {
        //         window.Telegram.WebApp.disableVerticalSwipes();
        //     }
        //     if (window.Telegram.WebApp.requestFullscreen) {
        //         window.Telegram.WebApp.requestFullscreen();
        //     }
        // }

        // ==========================================
        // SET YOUR LAUNCH DATE HERE
        // Format: "YYYY-MM-DDTHH:MM:SS"
        // Example: "2026-06-01T12:00:00"
        // ==========================================
        const launchDate = new Date("2026-05-22T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance <= 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        // Update immediately, then every second
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
